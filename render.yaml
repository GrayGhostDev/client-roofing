services:
  # Backend API Service
  - type: web
    name: iswitch-roofs-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: iswitch-roofs-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: iswitch-roofs-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: BIRDEYE_API_KEY
        sync: false
      - key: YELP_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # Redis Cache
  - type: redis
    name: iswitch-roofs-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # PostgreSQL Database (optional - use Supabase for production)
  - name: iswitch-roofs-db
    region: oregon
    plan: starter
    postgresMajorVersion: 15
    ipAllowList: []
